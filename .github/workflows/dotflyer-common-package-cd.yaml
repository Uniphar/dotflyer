name: CD for DotFlyer Common Package

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - .github/workflows/dotflyer-common-package-cd.yaml
      - src/DotFlyer.Common/**

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  Package_CD:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.x"

      - name: gh-app-install token
        id: gh-app
        uses: getsentry/action-github-app-token@v3
        with:
          app_id: ${{ secrets.ACTIONS_AUTH_APP_ID }}
          private_key: ${{ secrets.ACTIONS_AUTH_APP_PRIVATE_KEY }}

      - name: checkout devops-azure repo
        uses: actions/checkout@v6
        with:
          path: devops-azure
          repository: Uniphar/devops-azure
          token: ${{ steps.gh-app.outputs.token }}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: dotnet pack
        working-directory: ./src/DotFlyer.Common
        run: dotnet pack --configuration Release -o ./.nupkgs

      - name: dotnet nuget push
        working-directory: ./src/DotFlyer.Common
        run: dotnet nuget push ./.nupkgs/*.nupkg --source 'https://api.nuget.org/v3/index.json' --api-key  ${{steps.login.outputs.NUGET_API_KEY}}
